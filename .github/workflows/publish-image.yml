name: Publish Release Container Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/wiwekaputera/if4020-tugas3-12/veriseal
  DEFAULT_VERSION: "1.0.0"

jobs:
  build-and-push:
    name: Build & Push linux/amd64 Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -eu
          TAGS="${IMAGE_REPO}:${DEFAULT_VERSION}"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            CLEAN_VER="${RAW_TAG#v}"
            if [[ "${CLEAN_VER}" != "${DEFAULT_VERSION}" ]]; then
              TAGS="${TAGS},${IMAGE_REPO}:${CLEAN_VER}"
            fi
            TAGS="${TAGS},${IMAGE_REPO}:${RAW_TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push linux/amd64 container image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Write pinned @sha256 digest reference to job summary
        run: |
          set -eu
          PINNED_REF="${IMAGE_REPO}:${DEFAULT_VERSION}@${{ steps.push.outputs.digest }}"
          echo "Pinned Image Reference: ${PINNED_REF}"
          {
            echo "## Published Container Image (\`linux/amd64\`)"
            echo ""
            echo "- **Version Tag:** \`${IMAGE_REPO}:${DEFAULT_VERSION}\`"
            echo "- **Git Ref:** \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`)"
            echo "- **Digest:** \`${{ steps.push.outputs.digest }}\`"
            echo "- **Pinned Image Reference (for CI & README):**"
            echo ""
            echo "\`\`\`text"
            echo "${PINNED_REF}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
